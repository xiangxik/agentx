services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${DB_NAME:-agentx}
      POSTGRES_USER: ${DB_USER:-agentx}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-agentx}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: maven:3.9.9-eclipse-temurin-21
    working_dir: /workspace
    command: mvn -f backend/pom.xml spring-boot:run
    env_file:
      - ../.env
    ports:
      - '8080:8080'
    volumes:
      - ..:/workspace
    depends_on:
      - postgres

  frontend:
    image: node:24
    working_dir: /workspace
    command: sh -c "npm install && npm run build && npx vite preview --host 0.0.0.0 --port 4173 --workspace @agentx/chat-page"
    ports:
      - '4173:4173'
    volumes:
      - ..:/workspace

  reverse-proxy:
    image: nginx:1.27-alpine
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
